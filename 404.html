<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting…</title>
    <script>
      (function () {
        var path = window.location.pathname.replace(/^\/+|\/+$/g, "");
        var known = { resources: "/resources.html" };
        var target = known[path.toLowerCase()] || ("/" + (path ? "#" + path.toLowerCase() : "") + window.location.search);
        window.location.replace(window.location.origin + target);
      })();
    </script>
  </head>
  <body></body>
</html>
